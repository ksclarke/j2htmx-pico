name: Build with Maven

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        java_version: [ 21, 25 ]
        java_distro: [ graalvm ]
        maven_version: [ 3.8.6 ]
        os: [ windows-latest, macOS-latest, ubuntu-latest ]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: ${{ matrix.java_version }}
          distribution: ${{ matrix.java_distro }}
          cache: maven

      # If running locally in act, install Maven
      - name: Set up Maven if needed
        if: ${{ env.ACT }}
        uses: stCarolas/setup-maven@d6af6abeda15e98926a57b5aa970a96bb37f97d1 # v5
        with:
          maven-version: ${{ matrix.maven_version }}

      - name: Build with Maven
        shell: bash
        run: |
          mvn -V --no-transfer-progress --batch-mode -Dorg.slf4j.simpleLogger.log.net.sourceforge.pmd=error \
          verify javadoc:javadoc
